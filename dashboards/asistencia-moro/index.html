<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor de Asistencia · MORO</title>
<script src="/d/_assets/grid-sdk.js"></script>
<style>
  :root {
    --accent: #4FD1C5;
    --accent-dark: #2D3748;
    --text-primary: #1f2733;
    --text-secondary: #A0AEC0;
    --bg-page: #F7FAFC;
    --bg-card: #FFFFFF;
    --radius-card: 15px;
    --radius-shell: 16px;
    --shadow-card: 0px 3.5px 5.5px rgba(0, 0, 0, 0.05);
    --shadow-navbar: 0px 7px 23px rgba(0, 0, 0, 0.05);
    --font: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    --green: #48BB78;
    --amber: #ED8936;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-page);
    font-family: var(--font);
    color: var(--text-primary);
  }
  .icon { width: 20px; height: 20px; display: inline-block; vertical-align: middle; fill: currentColor; }
  #app { max-width: 1180px; margin: 0 auto; padding: 20px 20px 48px; }

  /* Navbar */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    background: linear-gradient(112.83deg, rgba(255,255,255,.82) 0%, rgba(255,255,255,.8) 110.84%);
    border: 1.5px solid #FFFFFF;
    border-radius: var(--radius-shell);
    box-shadow: var(--shadow-navbar);
    padding: 16px 24px;
    margin-bottom: 20px;
  }
  .navbar .crumb { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
  .navbar h1 { font-size: 20px; margin: 2px 0 0; font-weight: 700; }
  .navbar-right { display: flex; align-items: center; gap: 14px; }
  .updated-at { font-size: 12px; color: var(--text-secondary); text-align: right; line-height: 1.4; }
  .refresh-btn {
    display: flex; align-items: center; gap: 6px;
    background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius-card); padding: 10px 16px;
    font-family: var(--font); font-weight: 700; font-size: 13px;
    cursor: pointer; transition: box-shadow .2s linear, transform .2s linear;
  }
  .refresh-btn:hover { box-shadow: 0 4px 12px rgba(79,209,197,.4); }
  .refresh-btn:active { transform: scale(0.97); }
  .refresh-btn.spinning .icon { animation: spin 0.8s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Stat row */
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .stat-card {
    background: var(--bg-card); border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    padding: 18px 20px; display: flex; align-items: center; gap: 14px;
  }
  .icon-box {
    width: 44px; height: 44px; min-width: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff;
  }
  .icon-box.muted { background: var(--bg-page); color: var(--accent); }
  .stat-card .label { font-size: 12px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
  .stat-card .value { font-size: 20px; font-weight: 700; margin-top: 2px; }

  /* Hero cards (per person) */
  .section-title { font-size: 13px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 12px; }
  .hero-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .hero-card {
    background: var(--bg-card); border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    padding: 22px; display: flex; flex-direction: column; gap: 14px;
  }
  .hero-top { display: flex; align-items: center; gap: 14px; }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%; background: var(--accent-dark); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; min-width: 52px;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .hero-name { font-size: 16px; font-weight: 700; }
  .hero-role { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em; margin-left: auto;
  }
  .status-pill.ok { background: rgba(72,187,120,.12); color: var(--green); }
  .status-pill.stale { background: rgba(160,174,192,.15); color: var(--text-secondary); }
  .hero-divider { height: 1px; background: #EDF2F7; }
  .hero-detail { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-primary); }
  .hero-detail .icon { width: 16px; height: 16px; color: var(--text-secondary); }
  .hero-time { font-size: 22px; font-weight: 700; }
  .hero-date { font-size: 12px; color: var(--text-secondary); }

  /* Table card */
  .table-card { background: var(--bg-card); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 22px; }
  .table-card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .table-card-header h2 { font-size: 16px; margin: 0; }
  .search-wrap { position: relative; }
  .search-wrap .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); width: 16px; height: 16px; }
  .search-wrap input {
    font-family: var(--font); border: 1px solid #E2E8F0; border-radius: var(--radius-card);
    padding: 9px 14px 9px 34px; font-size: 13px; width: 220px; outline: none; background: var(--bg-page);
  }
  .search-wrap input:focus { border-color: var(--accent); }

  .range-select {
    font-family: var(--font); border: 1px solid #E2E8F0; border-radius: var(--radius-card);
    padding: 9px 14px; font-size: 13px; background: var(--bg-page); color: var(--text-primary);
    outline: none; cursor: pointer;
  }
  .range-select:focus { border-color: var(--accent); }
  .table-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .range-note { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; color: var(--text-secondary); font-size: 11px; text-transform: uppercase;
    letter-spacing: .03em; font-weight: 700; padding: 0 10px 10px; border-bottom: 1px solid #EDF2F7;
  }
  tbody td { padding: 12px 10px; border-bottom: 1px solid #F7FAFC; vertical-align: middle; }
  tbody tr:hover { background: #FBFEFE; }
  .cell-name { font-weight: 600; }
  .cell-sub { color: var(--text-secondary); font-size: 12px; }
  .badge-site {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    background: rgba(79,209,197,.12); color: #2C7A7B;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--text-secondary); }

  .state-banner {
    display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-radius: var(--radius-card);
    font-size: 13px; margin-bottom: 20px;
  }
  .state-banner.error { background: #FFF5F5; color: #C53030; }
  .state-banner.loading { background: #F7FAFC; color: var(--text-secondary); }
  .empty-row td { text-align: center; color: var(--text-secondary); padding: 30px 10px; }

  @media (max-width: 640px) {
    .navbar { flex-direction: column; align-items: flex-start; }
    .navbar-right { width: 100%; justify-content: space-between; }
    .search-wrap input { width: 100%; }
  }
</style>
</head>

<script>
  // ---- Configuración ----
  // GRID_DOC_ID se completa después del primer upload a Grid (Grid.sheets.* requiere
  // conocer el doc_id del propio documento). Ver instrucciones de despliegue.
  const GRID_DOC_ID = "01M1PW6J9SJ80G4M5CNNQW7TS5";
  const SHEET_ID = "1Y9BE_qwVnUXrTysChqDE1goSOmyiqVwdhMOcSYoJkeQ";
  const SHEET_RANGE = "moro!A1:Z2000";
  const AUTO_REFRESH_MS = 45000;

  const EXPECTED_COLS = [
    "MARCA_TEMPORAL", "USUARIO_GUARDIA", "NOMBRE",
    "APELLIDO_PATERNO", "APELLIDO_MATERNO", "PUESTO", "SITIO", "CURP"
  ];
  // La foto no siempre tiene un encabezado consistente; si no aparece por nombre,
  // se usa la columna K (índice 10, base 0) tal como se ve en la hoja.
  const FOTO_HEADER_CANDIDATES = ["FOTO", "FOTOGRAFIA", "IMAGEN", "PHOTO"];
  const FOTO_FALLBACK_COL_INDEX = 10;

  function normalizeHeader(h) {
    return String(h || "")
      .trim()
      .toUpperCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, "_");
  }

  function parseSheetDate(str) {
    if (!str) return null;
    const s = String(str).trim();
    const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[, ]+(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
    if (m) {
      const [, day, month, year, hour, min, sec] = m;
      return new Date(+year, +month - 1, +day, +hour, +min, sec ? +sec : 0);
    }
    const d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }

  function initials(nombre, apPaterno) {
    const a = (nombre || "").trim().charAt(0);
    const b = (apPaterno || "").trim().charAt(0);
    return (a + b).toUpperCase() || "?";
  }

  function fmtDateTime(d) {
    if (!d) return "Fecha no reconocida";
    return new Intl.DateTimeFormat("es-MX", { dateStyle: "medium", timeStyle: "short" }).format(d);
  }

  function fmtTime(d) {
    if (!d) return "--:--";
    return new Intl.DateTimeFormat("es-MX", { timeStyle: "short" }).format(d);
  }

  function isSameDay(a, b) {
    return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  function extractDriveFileId(url) {
    if (!url) return null;
    const patterns = [
      /[?&]id=([a-zA-Z0-9_-]{10,})/,
      /\/file\/d\/([a-zA-Z0-9_-]{10,})/,
      /\/d\/([a-zA-Z0-9_-]{10,})/,
    ];
    for (const re of patterns) {
      const m = String(url).match(re);
      if (m) return m[1];
    }
    return null;
  }

  function driveThumbnailUrl(url) {
    const id = extractDriveFileId(url);
    return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w200` : null;
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  let allRecords = [];

  function showBanner(type, html) {
    const el = document.getElementById("stateBanner");
    if (!html) { el.innerHTML = ""; return; }
    el.innerHTML = `<div class="state-banner ${type}">${html}</div>`;
  }

  function parseRows(values) {
    if (!values || !values.length) return [];
    const headerRow = values[0].map(normalizeHeader);
    const colIndex = {};
    EXPECTED_COLS.forEach((col) => {
      const idx = headerRow.indexOf(col);
      if (idx !== -1) colIndex[col] = idx;
    });

    const missing = EXPECTED_COLS.filter((c) => !(c in colIndex));
    if (missing.length) {
      showBanner("error",
        `No se encontraron todas las columnas esperadas en la pestaña <b>moro</b>. ` +
        `Faltan: ${missing.join(", ")}. Encabezados leídos: ${headerRow.join(", ") || "(vacío)"}.`
      );
    }

    const get = (row, col) => (col in colIndex ? (row[colIndex[col]] || "").trim() : "");

    let fotoColIndex = FOTO_FALLBACK_COL_INDEX;
    for (const cand of FOTO_HEADER_CANDIDATES) {
      const idx = headerRow.indexOf(cand);
      if (idx !== -1) { fotoColIndex = idx; break; }
    }

    return values.slice(1)
      .filter((row) => row && row.some((c) => String(c || "").trim() !== ""))
      .map((row) => {
        const nombre = get(row, "NOMBRE");
        const apPaterno = get(row, "APELLIDO_PATERNO");
        const apMaterno = get(row, "APELLIDO_MATERNO");
        const marcaTemporal = get(row, "MARCA_TEMPORAL");
        return {
          marcaTemporal,
          fecha: parseSheetDate(marcaTemporal),
          fotoUrl: (row[fotoColIndex] || "").trim(),
          usuarioGuardia: get(row, "USUARIO_GUARDIA"),
          nombre, apPaterno, apMaterno,
          nombreCompleto: [nombre, apPaterno, apMaterno].filter(Boolean).join(" ").trim() || "(sin nombre)",
          puesto: get(row, "PUESTO"),
          sitio: get(row, "SITIO"),
          curp: get(row, "CURP"),
        };
      });
  }

  function renderStats(records) {
    const now = new Date();
    const people = new Set(records.map((r) => r.curp || r.nombreCompleto.toLowerCase()));
    const sites = new Set(records.filter((r) => r.sitio).map((r) => r.sitio));
    const today = records.filter((r) => isSameDay(r.fecha, now)).length;

    document.getElementById("statPeople").textContent = people.size;
    document.getElementById("statToday").textContent = today;
    document.getElementById("statSites").textContent = sites.size;
    document.getElementById("statTotal").textContent = records.length;
    document.getElementById("statRow").style.display = "grid";
  }

  function renderHeroCards(records) {
    const byPerson = new Map();
    const byPersonPhoto = new Map();
    records.forEach((r) => {
      const key = r.curp || r.nombreCompleto.toLowerCase();
      const current = byPerson.get(key);
      if (!current || (r.fecha && (!current.fecha || r.fecha > current.fecha))) {
        byPerson.set(key, r);
      }
      if (r.fotoUrl) {
        const currentPhoto = byPersonPhoto.get(key);
        if (!currentPhoto || (r.fecha && (!currentPhoto.fecha || r.fecha > currentPhoto.fecha))) {
          byPersonPhoto.set(key, r);
        }
      }
    });

    const people = Array.from(byPerson.values()).sort((a, b) => a.nombreCompleto.localeCompare(b.nombreCompleto));
    const grid = document.getElementById("heroGrid");
    const now = new Date();

    grid.innerHTML = people.map((r) => {
      const hoursSince = r.fecha ? (now - r.fecha) / 36e5 : Infinity;
      const fresh = hoursSince <= 12;
      const key = r.curp || r.nombreCompleto.toLowerCase();
      const photoRow = byPersonPhoto.get(key);
      const thumbUrl = photoRow ? driveThumbnailUrl(photoRow.fotoUrl) : null;
      const avatarInner = thumbUrl
        ? `<img src="${escapeHtml(thumbUrl)}" alt="${escapeHtml(r.nombreCompleto)}" ` +
          `onerror="this.replaceWith(Object.assign(document.createElement('span'), {textContent: '${escapeHtml(initials(r.nombre, r.apPaterno))}'}))">`
        : escapeHtml(initials(r.nombre, r.apPaterno));
      return `
        <div class="hero-card">
          <div class="hero-top">
            <div class="avatar">${avatarInner}</div>
            <div>
              <div class="hero-name">${escapeHtml(r.nombreCompleto)}</div>
              <div class="hero-role">${escapeHtml(r.puesto || "Puesto no especificado")}</div>
            </div>
            <span class="status-pill ${fresh ? "ok" : "stale"}">
              <svg class="icon" style="width:12px;height:12px"><use href="#icon-check"/></svg>
              ${fresh ? "Registrado" : "Sin registro reciente"}
            </span>
          </div>
          <div class="hero-divider"></div>
          <div class="hero-time">${fmtTime(r.fecha)}</div>
          <div class="hero-date">${escapeHtml(r.fecha ? fmtDateTime(r.fecha) : r.marcaTemporal || "Sin fecha")}</div>
          <div class="hero-detail"><svg class="icon"><use href="#icon-place"/></svg> ${escapeHtml(r.sitio || "Sitio no especificado")}</div>
          <div class="hero-detail"><svg class="icon"><use href="#icon-verified"/></svg> Guardia: ${escapeHtml(r.usuarioGuardia || "—")}</div>
        </div>
      `;
    }).join("");

    document.getElementById("heroSection").style.display = people.length ? "block" : "none";
  }

  function renderTable(records, filterText, rangeDays) {
    const tbody = document.getElementById("tableBody");
    const sorted = [...records].sort((a, b) => {
      if (a.fecha && b.fecha) return b.fecha - a.fecha;
      if (a.fecha) return -1;
      if (b.fecha) return 1;
      return 0;
    });

    const totalCount = sorted.length;
    let ranged = sorted;
    if (rangeDays > 0) {
      const cutoff = new Date(Date.now() - rangeDays * 24 * 60 * 60 * 1000);
      // Las filas sin fecha reconocible se mantienen visibles: no hay forma segura de excluirlas por rango.
      ranged = sorted.filter((r) => !r.fecha || r.fecha >= cutoff);
    }

    const rangeNote = document.getElementById("rangeNote");
    if (rangeDays > 0 && ranged.length < totalCount) {
      rangeNote.textContent =
        `Mostrando ${ranged.length} de ${totalCount} registros (últimos ${rangeDays} días). ` +
        `Selecciona "Todo el historial" para ver el resto.`;
    } else {
      rangeNote.textContent = "";
    }

    const term = (filterText || "").trim().toLowerCase();
    const filtered = term
      ? ranged.filter((r) =>
          r.nombreCompleto.toLowerCase().includes(term) ||
          r.sitio.toLowerCase().includes(term))
      : ranged;

    if (!filtered.length) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="5">Sin registros que coincidan.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map((r) => `
      <tr>
        <td>
          <div>${escapeHtml(fmtTime(r.fecha))}</div>
          <div class="cell-sub">${escapeHtml(r.fecha ? new Intl.DateTimeFormat("es-MX", { dateStyle: "medium" }).format(r.fecha) : (r.marcaTemporal || "—"))}</div>
        </td>
        <td>
          <div class="cell-name">${escapeHtml(r.nombreCompleto)}</div>
          <div class="cell-sub">${escapeHtml(r.curp || "")}</div>
        </td>
        <td>${r.sitio ? `<span class="badge-site">${escapeHtml(r.sitio)}</span>` : "—"}</td>
        <td>${escapeHtml(r.puesto || "—")}</td>
        <td>${escapeHtml(r.usuarioGuardia || "—")}</td>
      </tr>
    `).join("");
  }

  function renderAll() {
    const term = document.getElementById("searchInput").value;
    const rangeDays = Number(document.getElementById("rangeSelect").value);
    renderStats(allRecords);
    renderHeroCards(allRecords);
    renderTable(allRecords, term, rangeDays);
  }

  async function loadData(isManual) {
    const btn = document.getElementById("refreshBtn");
    btn.classList.add("spinning");
    try {
      if (GRID_DOC_ID === "__GRID_DOC_ID__") {
        throw new Error("SETUP");
      }
      Grid.configure({ docId: GRID_DOC_ID });
      const data = await Grid.sheets.get(SHEET_ID, SHEET_RANGE);
      allRecords = parseRows(data.values);
      if (!allRecords.length) {
        showBanner("loading", "La pestaña <b>moro</b> no tiene registros todavía.");
      } else if (document.querySelector(".state-banner.error") === null) {
        showBanner(null);
      }
      renderAll();
      document.getElementById("updatedAt").textContent =
        "Actualizado " + new Intl.DateTimeFormat("es-MX", { timeStyle: "medium" }).format(new Date());
    } catch (err) {
      console.error(err);
      if (err && err.message === "SETUP") {
        showBanner("error",
          "Este documento aún no tiene su <b>doc_id</b> configurado. Sube esta versión a Grid, copia el " +
          "<code>doc_id</code> que te devuelve, reemplázalo en <code>GRID_DOC_ID</code> y vuelve a subir el archivo."
        );
      } else {
        showBanner("error",
          "No se pudo leer la hoja de cálculo. Verifica que la cuenta de Google del dueño de este documento " +
          "esté conectada en Grid (Configuración &rarr; Conectar Google) y que la pestaña <b>moro</b> exista en el spreadsheet."
        );
      }
    } finally {
      btn.classList.remove("spinning");
    }
  }

  document.getElementById("refreshBtn").addEventListener("click", () => loadData(true));
  document.getElementById("searchInput").addEventListener("input", renderAll);
  document.getElementById("rangeSelect").addEventListener("change", renderAll);

  loadData(false);
  setInterval(() => loadData(false), AUTO_REFRESH_MS);
</script>

</body>
</html>
